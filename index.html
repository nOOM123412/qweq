<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Raise Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-2: #141414;
    --card: #181818;
    --card-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #8a8a8a;
    --accent: #ffffff;
    --radius: 20px;
    --nav-h: 66px;
    --nav-space: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(255,255,255,0.08), transparent 60%),
      radial-gradient(ellipse 600px 300px at 100% 100%, rgba(255,255,255,0.04), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px calc(20px + var(--nav-space));
    position: relative;
    z-index: 1;
    animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }

  /* HERO */
  .hero {
    text-align: center;
    margin-bottom: 24px;
    padding: 14px 0 6px;
  }
  .hero-title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(180deg, #ffffff 0%, #9a9a9a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .hero-sub {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  /* PANELS / HOME */
  .panel {
    background: linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .panel-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 12px;
    letter-spacing: -0.2px;
  }
  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 9px 0;
  }
  .info-row + .info-row { border-top: 1px solid rgba(255,255,255,0.05); }
  .info-ico {
    width: 26px; height: 26px;
    border-radius: 9px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .info-text { font-size: 13px; line-height: 1.45; color: #d4d4d4; }
  .info-text b { color: var(--text); }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat {
    background: linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-v {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 3px;
  }
  .stat-k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }


  /* ACTION BUTTONS (главное меню) */
  .actions { display: grid; gap: 12px; margin-top: 4px; }
  .action {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s;
  }
  .action:active { transform: scale(0.975); border-color: rgba(255,255,255,0.3); }
  .action-ico {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #2a2a2a, #151515);
    border: 1px solid #333;
  }
  .action-ico.gold {
    background: linear-gradient(135deg, #3a2f10, #1a1508);
    border-color: #5a4a1c;
  }
  .action-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .action-arrow {
    margin-left: auto;
    color: #4a4a4a;
    font-size: 16px;
    flex-shrink: 0;
  }
  .pill {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    letter-spacing: 0.2px;
  }

  /* PRODUCTS */
  .product {
    background: linear-gradient(160deg, var(--card-2) 0%, var(--card) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 14px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .product:nth-child(1) { animation-delay: 0.05s; }
  .product:nth-child(2) { animation-delay: 0.10s; }
  .product:nth-child(3) { animation-delay: 0.15s; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: none; }
  }
  .product.open {
    border-color: rgba(255,255,255,0.25);
    box-shadow: 0 12px 40px rgba(255,255,255,0.06);
  }
  .product-head {
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .product-head:active { background: rgba(255,255,255,0.03); }
  .product-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2a2a2a, #151515);
    border: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .product.open .product-icon { transform: scale(1.1) rotate(-5deg); }
  .product-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 3px;
  }
  .product-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .product-arrow {
    margin-left: auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 10px;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
  }
  .product.open .product-arrow {
    transform: rotate(180deg);
    background: #ffffff;
    color: #000;
  }
  .product-body {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .product.open .product-body { grid-template-rows: 1fr; }
  .product-body-inner { overflow: hidden; }
  .product-body-content { padding: 0 20px 20px; }

  /* PLAN */
  .plan {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 10px;
  }
  .plan-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .plan-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .periods {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .period-btn {
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }
  .period-btn:active {
    transform: scale(0.96);
    border-color: #fff;
    background: #1a1a1a;
  }
  .period-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-handle {
    width: 40px; height: 4px;
    background: #333;
    border-radius: 2px;
    margin: 0 auto 18px;
    flex-shrink: 0;
  }
  .modal-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
    flex-shrink: 0;
  }
  .modal-body {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
    min-height: 0;
  }
  .modal-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .modal-row:last-of-type { border-bottom: none; margin-bottom: 8px; }
  .modal-row .k { color: var(--muted); }
  .modal-row .v { font-weight: 600; }

  /* REVIEWS */
  .reviews-summary {
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 6px;
  }
  .rs-score { font-size: 34px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
  .rs-meta { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .review {
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    gap: 12px;
  }
  .review:last-child { border-bottom: none; }
  .rev-ava {
    width: 36px; height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }
  .rev-body { flex: 1; min-width: 0; }
  .rev-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .rev-name { font-size: 13px; font-weight: 700; }
  .rev-date { font-size: 11px; color: #6a6a6a; margin-left: auto; flex-shrink: 0; }
  .rev-stars { font-size: 10px; color: #f5c451; letter-spacing: 1.5px; margin-bottom: 5px; }
  .rev-text { font-size: 13px; line-height: 1.5; color: #cfcfcf; word-wrap: break-word; }
  .rev-buy {
    display: inline-block;
    margin-top: 7px;
    font-size: 10px;
    color: #7a7a7a;
    background: rgba(255,255,255,0.05);
    padding: 3px 8px;
    border-radius: 8px;
  }

  /* SUPPORT FORM */
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .textarea {
    width: 100%;
    min-height: 130px;
    resize: none;
    background: #0f0f0f;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 6px;
  }
  .textarea:focus { border-color: rgba(255,255,255,0.4); }
  .textarea::placeholder { color: #5a5a5a; }
  .counter { text-align: right; font-size: 11px; color: #5a5a5a; margin-bottom: 14px; }

  .period-price {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .stars { color: #f5c451; font-size: 12px; letter-spacing: 1px; }


  /* BUTTONS */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 10px;
    user-select: none;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.97); }
  .btn-white {
    background: #ffffff;
    color: #000;
    box-shadow: 0 4px 24px rgba(255,255,255,0.15);
  }
  .btn-white:disabled { opacity: 0.45; box-shadow: none; }
  .btn-outline {
    background: transparent;
    border: 1px solid #333;
    color: var(--text);
  }
  .btn-outline:active { background: #1a1a1a; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: calc(var(--nav-space) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: #000;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 700;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
    line-height: 1.4;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #f43f5e; color: #fff; }

  .loader {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid #222;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================================
     GLASS TABBAR — iOS 26 Liquid Glass
     ============================================================ */
  .tabbar {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 120;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    width: calc(100% - 32px);
    max-width: 400px;
    border-radius: 28px;
    background: rgba(22, 22, 24, 0.42);
    -webkit-backdrop-filter: blur(32px) saturate(200%) brightness(1.05);
    backdrop-filter: blur(32px) saturate(200%) brightness(1.05);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow:
      0 12px 40px rgba(0, 0, 0, 0.55),
      0 2px 10px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -1px 0 rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  .tabbar::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    background:
      linear-gradient(180deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.06) 35%,
        rgba(255, 255, 255, 0) 65%);
    pointer-events: none;
  }
  .tabbar::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 28px;
    padding: 1px;
    background: linear-gradient(180deg,
      rgba(255, 255, 255, 0.35),
      rgba(255, 255, 255, 0.05) 40%,
      rgba(0, 0, 0, 0.25));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .tab {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 7px;
    border: none;
    border-radius: 22px;
    background: transparent;
    color: rgba(235, 235, 245, 0.6);
    font-family: inherit;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1px;
    cursor: pointer;
    transition: color 0.25s, background 0.35s, transform 0.2s;
  }
  .tab:active { transform: scale(0.94); }
  .tab-ico {
    font-size: 19px;
    line-height: 1;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tab.active {
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .tab.active .tab-ico { transform: translateY(-1px) scale(1.08); }
  .tab-badge {
    position: absolute;
    top: 4px;
    right: 24%;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: 8px;
    background: #f5c451;
    color: #000;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="loader"><div class="spinner"></div>Загрузка...</div>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab active" data-tab="home" onclick="setTab('home')">
    <span class="tab-ico">🏠</span><span>Главная</span>
  </button>
  <button class="tab" data-tab="shop" onclick="setTab('shop')">
    <span class="tab-ico">🛍</span><span>Магазин</span>
  </button>
  <button class="tab" data-tab="support" onclick="setTab('support')">
    <span class="tab-ico">💬</span><span>Поддержка</span>
  </button>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Модальное окно (bottom sheet) -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
try { tg.expand(); } catch (e) {}
try {
  tg.setHeaderColor('#0a0a0a');
  tg.setBackgroundColor('#0a0a0a');
} catch (e) {}

const BOT_USERNAME = 'Raise_Shop_Robot';
const TOTAL_REVIEWS = 317;

function resolveUserId() {
  try {
    const fromUrl = new URLSearchParams(location.search).get('uid')
      || new URLSearchParams(location.search).get('user_id');
    if (fromUrl && /^\d+$/.test(fromUrl)) return String(fromUrl);
  } catch (e) {}
  try {
    const tgId = tg.initDataUnsafe?.user?.id;
    if (tgId && /^\d+$/.test(String(tgId))) return String(tgId);
  } catch (e) {}
  try {
    const raw = tg.initData;
    if (raw) {
      const params = new URLSearchParams(raw);
      const u = JSON.parse(params.get('user') || '{}');
      if (u.id && /^\d+$/.test(String(u.id))) return String(u.id);
    }
  } catch (e) {}
  return null;
}

let userId = resolveUserId();

async function waitForUserId(maxWaitMs = 3000) {
  const start = Date.now();
  while (!userId && Date.now() - start < maxWaitMs) {
    await new Promise(r => setTimeout(r, 100));
    userId = resolveUserId();
  }
  return userId;
}

const app = document.getElementById('app');
const toast = document.getElementById('toast');
const modalOverlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

let state = {
  tab: 'home',
  products: [],
  periods: [],
  open: {},
  loaded: false,
  lastOrder: null,
  reviewsShown: 0,
  supportDraft: '',
  supportSending: false,
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fm(v) {
  v = Number(v) || 0;
  return Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.', ',');
}
function haptic(type) {
  try {
    if (type === 'ok') tg.HapticFeedback?.notificationOccurred('success');
    else if (type === 'err') tg.HapticFeedback?.notificationOccurred('error');
    else tg.HapticFeedback?.impactOccurred('light');
  } catch (e) {}
}
function showToast(text, isError = false) {
  if (!toast) { console.warn('toast missing:', text); return; }
  toast.textContent = text;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    toast.className = 'toast' + (isError ? ' error' : '');
  }, 2400);
  haptic(isError ? 'err' : 'ok');
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Ошибка сервера');
  return data;
}

function openModal(title, bodyHtml) {
  if (!modalOverlay || !modalTitle || !modalBody) {
    console.warn('modal DOM missing');
    return;
  }
  modalTitle.textContent = title;
  modalBody.innerHTML = bodyHtml;
  modalBody.scrollTop = 0;
  modalOverlay.classList.add('show');
}
function closeModal() {
  if (modalOverlay) modalOverlay.classList.remove('show');
}

  'ChatGPT Go', 'Gemini AI Ultra', 'ChatGPT Pro', 'Claude Ultra'];

// Детерминированный ГПСЧ — отзывы не меняются при перезагрузке
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const REVIEWS = (function buildReviews() {
  const rnd = seededRandom(20260205);
  const out = [];
  const today = new Date();
  for (let i = 0; i < TOTAL_REVIEWS; i++) {
    const name = REVIEW_NAMES[Math.floor(rnd() * REVIEW_NAMES.length)];
    const text = REVIEW_TEXTS[Math.floor(rnd() * REVIEW_TEXTS.length)];
    const product = REVIEW_PRODUCTS[Math.floor(rnd() * REVIEW_PRODUCTS.length)];
    // звёзды с перекосом в пятёрки (реалистично для хорошего магазина)
    const roll = rnd();
    const stars = roll < 0.84 ? 5 : roll < 0.94 ? 4 : roll < 0.985 ? 3 : 2;
    // дата: чем ближе к «сегодня», тем больше отзывов
    const daysAgo = Math.floor(Math.pow(rnd(), 1.6) * 400);
    out.push({
      name, text, product, stars,
      date: new Date(today.getTime() - daysAgo * 86400000),
    });
  }
  out.sort((a, b) => b.date - a.date);   // новые сверху
  return out;
})();

const REVIEW_AVG = (REVIEWS.reduce((s, r) => s + r.stars, 0) / REVIEWS.length).toFixed(1);

const AVA_PALETTE = ['#5b6cff', '#f5707a', '#f5a623', '#31c48d',
  '#a06bff', '#22a7f0', '#e26bb0', '#7cb342'];

function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 997;
  return AVA_PALETTE[h % AVA_PALETTE.length];
}
function fmtDate(d) {
  const m = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function starStr(n) {
  return '★'.repeat(n) + '☆'.repeat(5 - n);

  if (state.tab === tab) return;
  state.tab = tab;
  haptic();
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

}

                      const full = `${product.name} — ${plan.title} (${pd.title})`;
                      return `
                        <div class="period-btn" onclick="buyProduct('${esc(product.key)}','${esc(plan.code)}','${esc(pd.code)}',${Number(price) || 0},'${esc(full)}')">
                          <div class="period-name">${esc(pd.title)}</div>
                          <div class="period-price">${fm(price)} ₽</div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
  }

  html += `
    <div class="panel" style="text-align:center;padding:16px;margin-top:4px">
      <div class="info-text" style="color:#7a7a7a">
        Не нашли нужный сервис? Напишите в <b>Поддержку</b> — добавим.
      </div>
    </div>
  `;

  app.innerHTML = html;
}

function toggleProduct(key) {
  state.open[key] = !state.open[key];
  haptic();
  const el = document.querySelector(`[data-product="${key}"]`);
  if (el) el.classList.toggle('open', state.open[key]);
}

async function buyProduct(productKey, planCode, periodCode, price, title) {
  haptic();
  if (!userId) return showToast('Не удалось определить пользователя', true);
  state.lastOrder = { productKey, planCode, periodCode, price, title };
  openModal('Оформление заказа', `
    <div class="modal-row"><span class="k">Товар</span><span class="v">${esc(title)}</span></div>
    <div class="modal-row"><span class="k">Стоимость</span><span class="v">${fm(price)} ₽</span></div>
    <div class="modal-row"><span class="k">Оплата</span><span class="v">CryptoBot</span></div>
    <div class="modal-row"><span class="k">Выдача</span><span class="v">2–5 минут</span></div>
    <button class="btn btn-white" style="margin-top:16px" onclick="confirmBuy()">💳 Оплатить</button>
    <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
  `);
}

async function confirmBuy() {
  const params = state.lastOrder;
  if (!params) return showToast('Заказ не найден', true);
  try {
    const res = await api('/api/buy', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: Number(userId),
        amount: params.price,
        title: params.title,
      })
    });
    closeModal();
    if (res.pay_url) {
      // запоминаем счёт, чтобы проверить оплату после возврата из CryptoBot
      try { sessionStorage.setItem('lastInvoice', String(res.invoice_id || '')); } catch (e) {}
      try { tg.openTelegramLink(res.pay_url); }
      catch (e) { window.open(res.pay_url, '_blank'); }
      showToast('Перенаправляю в CryptoBot...');
    } else {
      showToast('Ошибка: нет ссылки на оплату', true);
    }
  } catch (e) { showToast(e.message, true); }
}

// Проверяем, оплачен ли последний счёт (после возврата пользователя из CryptoBot)
async function checkLastInvoice() {
  let invoiceId = '';
  try { invoiceId = sessionStorage.getItem('lastInvoice') || ''; } catch (e) {}
  if (!invoiceId) return;
  try {
    const res = await api('/api/invoice-status?invoice_id=' + encodeURIComponent(invoiceId));
    if (res.status === 'paid') {
      try { sessionStorage.removeItem('lastInvoice'); } catch (e) {}
      showToast('✅ Оплата получена! Заказ уже обрабатывается');
    } else if (res.status === 'expired') {
      try { sessionStorage.removeItem('lastInvoice'); } catch (e) {}
      showToast('⌛ Счёт истёк, создайте новый', true);
    }
  } catch (e) {}
}


// ---------- ПОДДЕРЖКА ----------
function renderSupport() {
  app.innerHTML = `
    <div class="hero" style="padding-bottom:0">
      <div class="hero-title">Поддержка</div>
      <div class="hero-sub">Отвечаем в течение 15 минут · 24/7</div>
    </div>

    <div class="panel">
      <div class="panel-title">Написать нам</div>
      <div class="field-label">Опишите вопрос — сообщение уйдёт администратору</div>
      <textarea
        class="textarea"
        id="supportText"
        maxlength="1000"
        placeholder="Например: оплатил ChatGPT Plus 30 минут назад, но заказ ещё не пришёл. Номер счёта — ..."
        oninput="onSupportInput(this)"
      ></textarea>
      <div class="counter" id="supportCounter">0 / 1000</div>
      <button class="btn btn-white" id="supportSend" onclick="sendSupport()" disabled>
        Отправить сообщение
      </button>
    </div>

    <div class="panel">
      <div class="panel-title">Частые вопросы</div>
      <div class="info-row">
        <div class="info-ico">⏱</div>
        <div class="info-text"><b>Сколько ждать заказ?</b><br>Обычно 2–5 минут после подтверждения оплаты. В пиковые часы — до 30 минут.</div>
      </div>
      <div class="info-row">
        <div class="info-ico">💳</div>
        <div class="info-text"><b>Как оплатить?</b><br>На вкладке «Магазин» выберите тариф — откроется счёт CryptoBot. Сумма указана в рублях.</div>
      </div>
      <div class="info-row">
        <div class="info-ico">🔁</div>
        <div class="info-text"><b>Можно продлить?</b><br>Да, оформите новый заказ на нужный период — доступ продлится автоматически.</div>
      </div>
      <div class="info-row">
        <div class="info-ico">💰</div>
        <div class="info-text"><b>Не пришёл заказ?</b><br>Напишите в форму выше с номером счёта — решим в течение 15 минут или вернём средства.</div>
      </div>
    </div>

    <div class="panel" style="text-align:center;padding:16px">
      <div class="info-text" style="color:#7a7a7a">
        Ответ придёт в чат бота <b>@${esc(BOT_USERNAME)}</b>
      </div>
    </div>
  `;
  const ta = document.getElementById('supportText');
  if (ta) {
    ta.value = state.supportDraft || '';
    onSupportInput(ta);
  }
}

function onSupportInput(el) {
  state.supportDraft = el.value;
  const counter = document.getElementById('supportCounter');
  const btn = document.getElementById('supportSend');
  if (counter) counter.textContent = `${el.value.length} / 1000`;
  if (btn) btn.disabled = el.value.trim().length < 3 || state.supportSending;
  el.style.height = 'auto';
  el.style.height = Math.min(Math.max(el.scrollHeight, 130), 300) + 'px';
}

async function sendSupport() {
  const el = document.getElementById('supportText');
  const text = (el?.value || '').trim();
  if (text.length < 3) return showToast('Напишите сообщение', true);
  if (!userId) return showToast('Не удалось определить пользователя', true);

  const btn = document.getElementById('supportSend');
  state.supportSending = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Отправка...'; }

  try {
    const tgUser = tg.initDataUnsafe?.user || {};
    await api('/api/support', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        user_id: Number(userId),
        text,
        username: tgUser.username || '',
        name: [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') || '',
      }),
    });
    state.supportDraft = '';
    if (el) el.value = '';
    if (btn) btn.textContent = '✅ Отправлено';
    showToast('Сообщение отправлено! Ответ придёт в чат бота');
    setTimeout(() => {
      state.supportSending = false;
      renderSupport();
    }, 1600);
    return;
  } catch (e) {
    showToast(e.message || 'Не удалось отправить', true);
  }
  state.supportSending = false;
  if (btn) { btn.disabled = false; btn.textContent = 'Отправить сообщение'; }
}

// ---------- ОТЗЫВЫ (модальное окно) ----------
function reviewHtml(r) {
  return `
    <div class="review">
      <div class="rev-ava" style="background:${avatarColor(r.name)}">${esc(r.name.charAt(0))}</div>
      <div class="rev-body">
        <div class="rev-top">
          <span class="rev-name">${esc(r.name)}</span>
          <span class="rev-date">${fmtDate(r.date)}</span>
        </div>
        <div class="rev-stars">${starStr(r.stars)}</div>
        <div class="rev-text">${esc(r.text)}</div>
        <div class="rev-buy">${esc(r.product)} · подтверждённая покупка</div>
      </div>
    </div>
  `;
}

function openReviews() {
  haptic();
  state.reviewsShown = 25;
  const five = REVIEWS.filter(r => r.stars === 5).length;
  const four = REVIEWS.filter(r => r.stars === 4).length;
  const rest = TOTAL_REVIEWS - five - four;
  openModal(`Отзывы (${TOTAL_REVIEWS})`, `
    <div class="reviews-summary">
      <div>
        <div class="rs-score">${REVIEW_AVG}</div>
        <div class="stars" style="margin-top:5px">${starStr(5)}</div>
      </div>
      <div>
        <div class="rs-meta">
          ${TOTAL_REVIEWS} отзывов · ${five} пятёрок · ${four} четвёрок · ${rest} остальных<br>
          Средняя оценка за последние 6 месяцев
        </div>
      </div>
    </div>
    <div id="reviewsList">${REVIEWS.slice(0, state.reviewsShown).map(reviewHtml).join('')}</div>
    <div style="padding:14px 0 4px" id="reviewsMoreWrap">
      <button class="btn btn-outline" style="margin:0" onclick="showMoreReviews()">Показать ещё</button>
    </div>
  `);
}

function showMoreReviews() {
  state.reviewsShown += 25;
  const list = document.getElementById('reviewsList');
  const wrap = document.getElementById('reviewsMoreWrap');
  if (!list) return;
  const next = REVIEWS.slice(list.children.length, state.reviewsShown);
  list.insertAdjacentHTML('beforeend', next.map(reviewHtml).join(''));
  haptic();
  if (state.reviewsShown >= REVIEWS.length && wrap) {
    wrap.innerHTML = `<div style="font-size:12px;color:#6a6a6a;text-align:center;padding:8px 0">Показаны все ${TOTAL_REVIEWS} отзывов</div>`;
  }
}

// ---------- ЗАГРУЗКА ----------
async function loadCatalog() {
  try {
    const data = await api('/api/catalog');
    state.products = data.products || [];
    state.periods = data.periods || [];
    state.loaded = true;
    if (state.tab === 'shop') renderShop();
  } catch (e) {
    if (state.tab === 'shop') {
      app.innerHTML = `
        <div class="loader">
          <div style="font-size:40px;margin-bottom:12px">⚠️</div>
          Не удалось загрузить каталог<br>
          <span style="font-size:12px;opacity:0.6">${esc(e.message)}</span>
          <div style="max-width:220px;margin:18px auto 0">
            <button class="btn btn-outline" style="margin:0" onclick="loadCatalog()">Повторить</button>
          </div>
        </div>
      `;
    }
  }
}

async function boot() {
  try { tg.ready(); tg.expand(); } catch (e) {}
  render();                       // главная рисуется сразу, каталог не нужен
  userId = await waitForUserId(3000);
  loadCatalog();
  // если пользователь вернулся из CryptoBot — проверим, оплачен ли счёт
  try { tg.onEvent('activated', checkLastInvoice); } catch (e) {}
  setTimeout(checkLastInvoice, 1500);
}

boot();
</script>
